name: regression

# 所有 action 钉**完整 commit SHA**（防第三方换版本标签投毒）。SHA 于 2026-10-19 由 tag 解引用取得。
# 回归门：上游字段错配、tag 漏项、lazy/cache_runtime 默认值漂移，都该在 push 时被拦住，
# 而不是等到打 APK 或装到手机上。只在 sing-box/ 有改动时跑。

on:
  push:
    branches: [main]
    paths:
      - 'sing-box/**'
      - '.github/workflows/regression.yml'
  pull_request:
    paths: ['sing-box/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sing-box
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.2"
          cache-dependency-path: sing-box/go.sum

      - name: 预热依赖（带重试）
        # 实测 proxy.golang.org 会随机返回 stream INTERNAL_ERROR（不同模块都碰到过），
        # 冷缓存（改了 go.sum 的 PR 必然冷缓存）时最容易撞。一次网络抖动不该让门禁假红。
        run: |
          set -euo pipefail
          n=0
          until go mod download; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "FATAL: 依赖下载连续 3 次失败（模块代理持续不可用）"; exit 1; fi
            echo "go mod download 第 $n 次失败，15s 后重试"; sleep 15
          done

      - name: 全 tag 构建（本机验证过的同一组 tag）
        run: go build -tags "with_easytier,with_quic,with_wireguard,with_utls,with_clash_api" -o /tmp/sing-box-full ./cmd/sing-box

      - name: 二进制自检：easytier 出站真的编进去了
        run: |
          /tmp/sing-box-full version
          /tmp/sing-box-full version 2>&1 | grep -q easytier || { echo "FATAL: 构建里没有 easytier 出站"; exit 1; }

      - name: go vet
        run: go vet -tags "with_easytier,with_quic,with_wireguard,with_utls,with_clash_api" ./protocol/easytier/... ./option/... ./include/...

      - name: 单测（lazy / cache_runtime 默认语义 + config_toml 互斥守卫）
        run: go test -count=1 -v -tags "with_easytier,with_quic,with_wireguard,with_utls,with_clash_api" -run EasyTier ./option/... ./protocol/easytier/...
