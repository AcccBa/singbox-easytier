name: apk

# 所有 action 钉**完整 commit SHA**（防第三方换版本标签投毒）。SHA 于 2026-10-19 由 tag 解引用取得。
# 端到端出「未签名 release APK」：sing-box/ 构 libbox.aar -> 放进 sfa/app/libs -> gradle。
# 单仓之后**不再跨仓 checkout**（原先要拉 AcccBa/easytier-sing-box，现在是本地目录）。
# 本工作流不持密钥：不传 LOCAL_PROPERTIES，build.gradle.kts 里「无 KEYSTORE_PASS 就不配签名」。

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "gomobile platform"
        default: android/arm64
  workflow_call:
    inputs:
      platform:
        type: string
        default: android/arm64

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-apk:
    runs-on: ubuntu-latest
    env:
      PLATFORM: ${{ inputs.platform || 'android/arm64' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.2"
          cache-dependency-path: sing-box/go.sum

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools build-tools;37.0.0 platforms;android-36 ndk;28.0.13004108"

      - name: 构建 libbox.aar 并放进 sfa/app/libs
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/28.0.* | head -1)"
          echo "NDK=$ANDROID_NDK_HOME"
          ( cd sing-box && go run ./cmd/internal/build_libbox -target android -platform "$PLATFORM" )
          mkdir -p sfa/app/libs
          cp sing-box/libbox.aar sing-box/libbox-legacy.aar sfa/app/libs/
          ls -la sfa/app/libs/

      - name: gradle 出未签名 release
        # 内存上限必须显式给：runner 只有 7GB，不设限会被 OOM 杀掉（实测 exit 143，死在 lintVital）
        run: |
          ( cd sfa && ./gradlew --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx2500m -XX:MaxMetaspaceSize=768m" \
            -Dkotlin.daemon.jvm.options="-Xmx1024m" \
            :app:assembleOtherRelease \
            -x lintVitalAnalyzeOtherRelease -x lintVitalReportOtherRelease -x lintVitalOtherRelease )

      - name: 回读产物（防 gradle UP-TO-DATE 打旧包：必须看到本次时间与 sha256）
        run: |
          find sfa/app/build/outputs/apk/other/release -name '*.apk' -exec ls -la {} \;
          find sfa/app/build/outputs/apk/other/release -name '*.apk' -exec sha256sum {} \; > apk-sha256.txt
          test -s apk-sha256.txt; cat apk-sha256.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SFA-unsigned
          path: |
            sfa/app/build/outputs/apk/other/release/*.apk
            apk-sha256.txt
          if-no-files-found: error
