name: release

# 所有 action 钉**完整 commit SHA**（防第三方换版本标签投毒）。SHA 于 2026-10-19 由 tag 解引用取得。
# 一次 run 内：构建（复用 apk.yml，该 job 读不到密钥）-> 签名（密钥只在 environment: sign-gate 可见）
# -> 证书指纹强制校验 -> SLSA 证明 -> 发布 prerelease。
# 信任边界：密钥只挂 environment；签名后证书 SHA-256 必须等于手机已信任指纹，不符即拒发；
# 只由人手动 dispatch；发布哈希另记在 CI 无写权限的仓（home-mesh 文档）。

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "标记为预发布"
        type: boolean
        default: true
      attest:
        description: "生成 SLSA 构建证明（需 public 仓）"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/apk.yml

  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: sign-gate
    permissions:
      actions: read
      contents: write
      attestations: write
      id-token: write
    env:
      EXPECTED_CERT_SHA256: b6f677491cc6e1ee0440afbc42568e9e114a6f963a2ee0a8780c7939e40e8012
      BT: /usr/local/lib/android/sdk/build-tools/37.0.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "build-tools;37.0.0"

      - name: 前置检查：签名所需 secret 必须齐（缺失明确报错，不静默）
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          missing=0
          for v in KEYSTORE_B64 KEYSTORE_PASS ALIAS_NAME ALIAS_PASS; do
            if [ -z "${!v}" ]; then echo "缺少 $v"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "FATAL: 请在 Settings -> Environments -> sign-gate 下配置上述 secret（不要放仓库级 Secrets）"
            exit 1
          fi
          # 粘贴事故最常见：带进空格/提示符/被截断。这里先验，别等到签名步才炸。
          SAN=$(printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t')
          if ! printf '%s' "$SAN" | base64 -d > /tmp/ks-probe 2>/dev/null; then
            echo "FATAL: KEYSTORE_B64 不是合法 base64（粘贴时多半带进了空格/提示符残留，或被截断）"
            echo "       重新生成并在网页覆盖： base64 -w0 ~/opt/keystores/easytier-sfa.keystore"
            exit 1
          fi
          SZ=$(stat -c%s /tmp/ks-probe)
          MAGIC=$(od -An -tx1 -N2 /tmp/ks-probe | tr -d ' ')
          rm -f /tmp/ks-probe
          echo "KEYSTORE_B64 解码 OK：$SZ 字节，头部 $MAGIC（feed=JKS，30=PKCS12）"
          if [ "$SZ" -lt 1000 ]; then echo "FATAL: 解出的 keystore 过小（$SZ B），必定是截断"; exit 1; fi
          case "$MAGIC" in
            feed*|30*) : ;;
            *) echo "FATAL: 头部不是 keystore 特征（feed…/30…），贴错内容了"; exit 1 ;;
          esac
          echo "secret 齐备且 keystore 形态正确（未打印任何值）"

      - name: 取本次 run 的未签名产物
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: SFA-unsigned
          run-id: ${{ github.run_id }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          path: in

      - name: 对齐、签名、强制校验证书指纹
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          set -euo pipefail
          APK=$(find in -name 'SFA-*arm64-v8a*unsigned.apk' | head -1)
          [ -n "$APK" ] || { echo "FATAL: 未找到 arm64 未签名 APK"; find in -type f; exit 1; }
          KS=$(mktemp /tmp/rs-XXXX.keystore)
          trap 'rm -f "$KS"' EXIT
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$KS"
          chmod 600 "$KS"
          "$BT/zipalign" -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS_NAME" \
            --ks-pass "pass:$KEYSTORE_PASS" --key-pass "pass:$ALIAS_PASS" \
            --out aligned-signed.apk aligned.apk
          CERT=$("$BT/apksigner" verify --print-certs aligned-signed.apk | awk '/certificate SHA-256 digest/{print $NF}')
          echo "签名证书 SHA-256=$CERT"
          if [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "FATAL: 证书与手机已信任指纹不符，拒绝发布（key 被换或 secret 配错）"
            exit 1
          fi
          mkdir -p out
          BASE=$(basename "${APK%.apk}"); BASE="${BASE%-unsigned}"
          mv aligned-signed.apk "out/${BASE}-signed.apk"
          ( cd out && sha256sum *-signed.apk > SHA256SUMS && cat SHA256SUMS )

      - name: 已签名产物留档（后续步骤失败也不丢）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SFA-signed
          path: out/
          if-no-files-found: error

      - name: SLSA 构建证明
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: out/*-signed.apk

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          VER=$(grep -m1 '^VERSION_NAME=' sfa/version.properties | cut -d= -f2)
          TAG="v${VER}-ci$RUN_ID"
          {
            echo "构建与签名同一次 run：$RUN_ID（https://github.com/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID）"
            echo
            echo "签名证书 SHA-256：$EXPECTED_CERT_SHA256"
            echo
            echo "校验值（sha256）："
            echo
            echo '```'
            cat out/SHA256SUMS
            echo '```'
            echo
            echo "注：同一哈希另记在 CI 无写权限的仓库（home-mesh 文档），两处不一致即为篡改信号。"
            echo "验签：apksigner verify --print-certs <apk> 应输出上面的证书指纹。"
          } > notes.md
          ARGS=(--target "$GITHUB_SHA" --title "SFA $VER (CI $RUN_ID)" --notes-file notes.md)
          if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "$TAG" out/*-signed.apk out/SHA256SUMS "${ARGS[@]}" || { echo "FATAL: 发布失败"; exit 1; }
          echo "已发布 tag=$TAG"
