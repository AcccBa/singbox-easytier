name: bump-easytier

# ② EasyTier 是依赖（sing-box/go.mod 里的 easytier-go），不是本仓源码。
# bump 需要 go get + go mod tidy 重算 go.sum，而维护机已无 Go 工具链 —— 所以在这里做。
# 只开 PR，绝不直推 main；PR 不会因为本 job 的 token 自动跑 workflow（GitHub 防递归），
# 所以最后一步显式在该分支上 dispatch regression，把回归门变成 PR 的验收。
# action 一律钉完整 commit SHA（与其余工作流同一策略）。

on:
  workflow_dispatch:
    inputs:
      target:
        description: "EasyTier commit SHA / tag，留 latest 表示上游 HEAD"
        default: "latest"

permissions:
  contents: write        # 推 bump 分支
  pull-requests: write   # 开 PR

concurrency:
  group: bump-easytier
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      MODULE: github.com/easytier/easytier/easytier-go
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: sing-box/go.sum

      - name: 解析目标 commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_IN: ${{ inputs.target }}
        run: |
          set -euo pipefail
          T="$TARGET_IN"
          if [ -z "$T" ] || [ "$T" = "latest" ]; then
            T=$(gh api "repos/EasyTier/easytier/commits?per_page=1" --jq '.[0].sha')
            echo "latest -> $T"
          fi
          # 允许传 tag 或 sha，故只校验非空
          [ -n "$T" ] || { echo "FATAL: 目标版本解析为空"; exit 1; }
          echo "ET_TARGET=$T" >> "$GITHUB_ENV"

      - name: 记录 bump 前的 pin
        run: |
          set -euo pipefail
          grep -m1 -oE "${MODULE} v[^ ]+" sing-box/go.mod | tee /tmp/pin_before
          test -s /tmp/pin_before || { echo "FATAL: go.mod 里找不到 ${MODULE}"; exit 1; }

      - name: go get + tidy + verify
        working-directory: sing-box
        run: |
          set -euo pipefail
          # 模块代理会抖（实测出现过 proxy.golang.org 的 stream INTERNAL_ERROR），
          # 一次网络抖动不该让整条 bump 白跑，故有界重试 3 次。
          n=0
          until go get "${MODULE}@${ET_TARGET}"; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "FATAL: go get 连续 3 次失败（代理持续抖动或目标不可解析）"; exit 1; fi
            echo "go get 第 $n 次失败，20s 后重试"; sleep 20
          done
          go mod tidy
          go mod verify
          echo "--- go.mod 变更（最多 20 行）---"
          git --no-pager diff -- go.mod | sed -n '1,20p' || true

      - name: 确认内嵌 wasm 内核随模块在位（这是不需要 Rust 的原因）
        run: |
          set -euo pipefail
          W=$(find "$(go env GOMODCACHE)"/github.com/easytier/easytier/ -path '*easytier-go*/internal/artifact/easytier_core.wasm' | head -1)
          [ -n "$W" ] || { echo "FATAL: 新模块里没有预编译 wasm 内核 —— bump 后产物会缺核"; exit 1; }
          ls -l "$W"

      - name: 有变更才开 PR（无变更不产假 PR）
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- sing-box/go.mod sing-box/go.sum; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "已是目标版本，无需 PR"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 推分支并开 PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT=$(printf '%s' "$ET_TARGET" | cut -c1-10)
          BRANCH="bump/easytier-${SHORT}"
          # 幂等：bump 分支由本 job 独占生成、从不手工编辑 ⇒ 已存在就覆盖复用，不新建带后缀的分支堆垃圾
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "既有分支 $BRANCH ⇒ 复用并强推覆盖"
            PUSH="git push -f -q origin $BRANCH"
          else
            PUSH="git push -q origin $BRANCH"
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add sing-box/go.mod sing-box/go.sum
          git commit -s -m "deps(easytier): bump easytier-go to ${ET_TARGET}" -m "由 bump-easytier.yml 生成（run ${GITHUB_RUN_ID}）。go.mod 之前：$(cat /tmp/pin_before)"
          eval "$PUSH"
          {
            echo "自动 bump：\`$(cat /tmp/pin_before)\` → \`${MODULE} ${ET_TARGET}\`。"
            echo
            echo "- go.sum 由 \`go mod tidy\` 重算，\`go mod verify\` 通过"
            echo "- 预编译 wasm 内核已确认随模块在位（无需 Rust 工具链）"
            echo "- 验收：同分支上的 regression 必须绿（本 job 已显式触发；GITHUB_TOKEN 开的 PR 不会自动跑 workflow）"
            echo "- 合并后仍需人手动 \`release.yml\` 才会出新 APK"
          } > /tmp/pr.md
          TITLE="deps(easytier): bump to ${SHORT}"
          OPEN=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then echo "已有开放 PR #$OPEN，跳过创建"; exit 0; fi
          if ! gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file /tmp/pr.md; then
            echo "gh pr create 失败，改走 REST 兜底"
            PR_URL=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls" \
                       -f title="$TITLE" -f head="$BRANCH" -f base=main \
                       -f body="$(cat /tmp/pr.md)" --jq .html_url) || {
              echo "FATAL: 两种方式都不能自动开 PR。"
              echo "       手动开： https://github.com/${GITHUB_REPOSITORY}/compare/${BRANCH}?expand=1"
              echo "       分支与提交已在远端，回归门也已触发，不必重跑本 job。"
              exit 1
            }
            echo "PR 已建（REST）：$PR_URL"
          fi

      - name: 报告 PR 与回归门状态（GITHUB_TOKEN 不能 dispatch，实测 403）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT=$(printf '%s' "$ET_TARGET" | cut -c1-10)
          BRANCH="bump/easytier-${SHORT}"
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          echo "PR=${PR:-未找到}"
          echo "回归门由 pull_request 事件自动触发；bot 首次提交的 PR 会停在 action_required（GitHub 默认门禁），需人放行："
          echo "  1) 找到该 PR 上的 run id： gh run list --repo $GITHUB_REPOSITORY --workflow regression.yml --limit 3"
          echo "  2) 放行（实测可用；gh 2.46 无 run approve 子命令）："
          echo "     gh api -X POST repos/$GITHUB_REPOSITORY/actions/runs/<run_id>/approve"
          echo "  绿了才允许合并本 PR；合并后仍需人手动 release.yml 才出新 APK。"
